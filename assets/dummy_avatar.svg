<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <!-- Background circle with subtle tech glow -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="160" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" fill="none" opacity="0.6"/>
  <circle cx="200" cy="200" r="130" stroke="#2563EB" stroke-width="1.5" fill="none" opacity="0.4"/>
  
  <!-- Silhouette / Developer Avatar -->
  <!-- Hoodie / Shoulders -->
  <path d="M90 380 C100 290, 140 260, 200 260 C260 260, 300 290, 310 380 Z" fill="url(#hoodieGrad)" />
  <!-- Inner Collar -->
  <path d="M165 260 Q200 295 235 260 Z" fill="#0F172A" />
  
  <!-- Neck -->
  <path d="M175 220 L225 220 L225 260 L175 260 Z" fill="#E2E8F0" opacity="0.85" />
  
  <!-- Head / Face silhouette -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="#F8FAFC" />
  
  <!-- Short Clean Haircut -->
  <path d="M142 170 C140 120, 170 105, 200 105 C230 105, 260 120, 258 170 C245 140, 220 135, 200 135 C175 135, 155 142, 142 170 Z" fill="#0F172A" />
  
  <!-- Glasses / Developer Headset -->
  <rect x="155" y="165" width="38" height="24" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="3" />
  <rect x="207" y="165" width="38" height="24" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="3" />
  <line x1="193" y1="177" x2="207" y2="177" stroke="#38BDF8" stroke-width="3" />

  <!-- Code Symbol on Hoodie -->
  <text x="200" y="335" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#38BDF8" text-anchor="middle">&lt;faril /&gt;</text>
  
  <!-- Tech Status Tag -->
  <rect x="125" y="45" width="150" height="28" rx="14" fill="#0F172A" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="145" cy="59" r="4" fill="#22C55E"/>
  <text x="160" y="64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#E2E8F0">DUMMY AVATAR</text>
</svg>
